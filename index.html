<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Новелла: Наша Компания — Серия 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-card {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 860px;
            background: linear-gradient(180deg, #1f2833 0%, #0b0c10 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 16px;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(10px);
            z-index: 20;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .status-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #ff6584;
        }

        .character-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 10px;
            overflow: hidden;
        }

        .character-card {
            width: 90%;
            height: 92%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 101, 132, 0.3);
            position: relative;
            background: #121212;
        }

        .character-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transition: opacity 0.3s ease-in-out;
        }

        .dialogue-card {
            background: rgba(15, 20, 25, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            padding: 18px 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 20;
        }

        .speaker-tag {
            font-size: 15px;
            font-weight: 700;
            color: #ff6584;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .dialogue-text {
            font-size: 15px;
            line-height: 1.5;
            color: #c5c6c7;
            font-weight: 400;
            margin-bottom: 12px;
        }

        .action-btn {
            align-self: flex-end;
            background: #ff6584;
            color: #0b0c10;
            border: none;
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 101, 132, 0.25);
            transition: all 0.2s ease;
        }

        .action-btn:active {
            transform: scale(0.96);
            background: #e04868;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <!-- Шапка с 1000 алмазов -->
        <div class="top-bar">
            <div class="status-item">💎 1000</div>
            <div class="status-item">👑 Серия 1</div>
            <div class="status-item">❤️ 10</div>
        </div>

        <!-- Сцена с персонажем -->
        <div class="character-stage">
            <div class="character-card">
                <img id="heroImage" src="" alt="Персонаж">
            </div>
        </div>

        <!-- Диалог -->
        <div class="dialogue-card">
            <div>
                <div class="speaker-tag" id="heroName">Артем</div>
                <div class="dialogue-text" id="heroText">Загрузка истории...</div>
            </div>
            <button class="action-btn" onclick="nextScene()">Далее ▶</button>
        </div>
    </div>

    <script>
        // Обновленный сценарий: фокус на Артёме и Кате + симпатия Кирилла и Серёжи
        const scenes = [
            {
                name: "Артем",
                text: "Пятничный вечер в ресторане начался с суматохи. Наша компания наконец-то в сборе, но всё мое внимание приковано только к Кате.",
                img: "https://raw.githubusercontent.com/ausov217-beep/Game/main/IMG_8596_62a45c.jpg"
            },
            {
                name: "Катя",
                text: "Артём, ты чего на меня так смотришь? У меня что-то не так с прической? 😉",
                img: "https://raw.githubusercontent.com/ausov217-beep/Game/main/IMG_8597_62a45c.jpg"
            },
            {
                name: "Артем",
                text: "Совсем наоборот. Ты выглядишь потрясающе... Как и всегда, впрочем.",
                img: "https://raw.githubusercontent.com/ausov217-beep/Game/main/IMG_8596_62a45c.jpg"
            },
            {
                name: "Ира",
                text: "Ой, ну началось! Вы бы еще за руки взялись под столом. Давайте лучше заказ сделаем, пока я не начала падать в голодный обморок.",
                img: "https://raw.githubusercontent.com/ausov217-beep/Game/main/IMG_8598_62a45c.jpg"
            },
            {
                name: "Кирилл",
                text: "Ира права, давайте поменьше романтики, побольше еды. Тем более, у нас тут свои секреты намечаются.",
                img: "https://raw.githubusercontent.com/ausov217-beep/Game/main/IMG_8595_62a45c.jpeg"
            },
            {
                name: "Сережа",
                text: "Кстати... Кирилл, ты ведь помнишь, что мы договаривались сесть рядом? Освободи мне местечко.",
                img: "https://raw.githubusercontent.com/ausov217-beep/Game/main/IMG_8602_62a45c.jpg"
            },
            {
                name: "Кирилл",
                text: "(Слегка смущаясь) Конечно помню, Сережа... Садись ближе, тут как раз уютнее всего.",
                img: "https://raw.githubusercontent.com/ausov217-beep/Game/main/IMG_8595_62a45c.jpeg"
            },
            {
                name: "Катя",
                text: "Смотрите-смотри, а Кирилл с Сережей явно не ровно дышат друг к другу! Кажется, у нас тут двойное свидание наклевывается.",
                img: "https://raw.githubusercontent.com/ausov217-beep/Game/main/IMG_8597_62a45c.jpg"
            },
            {
                name: "Артем",
                text: "Главное, чтобы они нам весь вечер не испортили своими переглядками. Катя, может, сбежим от них после ужина? Только вдвоем.",
                img: "https://raw.githubusercontent.com/ausov217-beep/Game/main/IMG_8596_62a45c.jpg"
            },
            {
                name: "Катя",
                text: "(Улыбается, опуская глаза) Я подумаю над твоим предложением, Артём... Сможешь меня убедить?",
                img: "https://raw.githubusercontent.com/ausov217-beep/Game/main/IMG_8597_62a45c.jpg"
            }
        ];

        let currentIndex = 0;

        function renderScene() {
            const current = scenes[currentIndex];
            document.getElementById("heroName").innerText = current.name;
            document.getElementById("heroText").innerText = current.text;
            
            const imgElement = document.getElementById("heroImage");
            imgElement.style.opacity = 0;
            
            setTimeout(() => {
                imgElement.src = current.img;
                imgElement.style.opacity = 1;
            }, 150);
        }

        function nextScene() {
            currentIndex++;
            if (currentIndex >= scenes.length) {
                currentIndex = 0; // Перезапуск серии
            }
            renderScene();
        }

        // Старт
        renderScene();
    </script>
</body>
</html>
